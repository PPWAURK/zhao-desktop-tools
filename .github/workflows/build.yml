name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.app }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        app: [jour-abs, video-compressor]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.app }}/src-tauri

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust tests (video-compressor includes a real ffmpeg stop/resume run)
        working-directory: ${{ matrix.app }}/src-tauri
        run: cargo test -- --include-ignored

      - name: Build installer
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ runner.os }}
          path: |
            ${{ matrix.app }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ matrix.app }}/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
